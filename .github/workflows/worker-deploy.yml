name: worker-deploy
# Deploys the parts worker (worker/modal_app.py) to Modal whenever it or the measure code changes,
# so a file's parts are always read by the same code as the corpus. Needs MODAL_TOKEN_ID and
# MODAL_TOKEN_SECRET; without them it stands down.
on:
  schedule:
    - cron: "40 4 * * *"   # daily: rebuild the separated records' parts file, so newly separated records (classics too) reach the loops and the comparison
  push:
    branches: [main]
    paths: ["worker/**", "features/stems.py", ".github/workflows/worker-deploy.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PARTS_KEY: ${{ secrets.PARTS_KEY }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ]; then echo "::notice::no Modal token yet; the worker is not deployed"; exit 0; fi
          pip install -q modal "fastapi[standard]"
          # the deploy log is not readable from outside, so its last lines become an annotation
          set +e
          # the shared password with the site: written from the pipeline's copy on every deploy, so the two cannot drift apart again
          if [ -n "$PARTS_KEY" ]; then modal secret create sonic-parts PARTS_KEY="$PARTS_KEY" --force >/dev/null && echo "worker password synced"; fi
          # every separated record's part measures, for the loops endpoint (kept privately with the model weights)
          python -m pip install -q numpy >/dev/null 2>&1; python tools/build_record_parts.py --out /tmp/record-parts.npz && modal volume put sonic-embed /tmp/record-parts.npz /record-parts.npz --force || echo "::warning title=record parts::not built"
          modal deploy worker/modal_app.py 2>&1 | tee /tmp/deploy.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            msg=$(tail -n 12 /tmp/deploy.log | sed 's/%/%25/g' | tr '\n' '|' | cut -c1-900)
            echo "::error title=modal deploy failed::$msg"
          else
            msg=$(grep -o 'https://[a-z0-9-]*--sonic-parts[a-z-]*\.modal\.run' /tmp/deploy.log | sort -u | tr '\n' ' ')
            echo "::notice title=worker endpoints::$msg"
          fi
          exit $rc
