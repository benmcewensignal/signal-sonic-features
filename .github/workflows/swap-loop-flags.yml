name: swap loop flags
# Every licensed loop heard once (tools/swap_loop_flags.py on Modal): length, level, silence, how much of its sound sits in
# its loudest tenth, its hits, whether its channels cancel in mono. Loops heard by an earlier run are not heard again
# (their measures come from the swap-test-results branch). The rule in tools/swap_loop_flags_apply.py turns the measures
# into worker/loop_flags.json, the loops the matcher never ranks; when that changes it is committed and the worker
# deployed. The samples workflow starts this after it adds loops to the library.
on:
  workflow_dispatch:
    inputs:
      deploy: { description: "deploy the worker even when the flags are unchanged (the library changed)", default: "false" }
permissions: { contents: write, actions: write }
concurrency: { group: swap-loop-flags, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q modal numpy
      - name: the loops heard before
        run: |
          mkdir -p out
          git fetch -q --depth 1 origin swap-test-results && git show origin/swap-test-results:loop-audio-measures.json > out/loop-audio-measures.json || rm -f out/loop-audio-measures.json
      - env: { MODAL_TOKEN_ID: "${{ secrets.MODAL_TOKEN_ID }}", MODAL_TOKEN_SECRET: "${{ secrets.MODAL_TOKEN_SECRET }}" }
        run: modal run tools/swap_loop_flags.py
      - name: the flags, committed when they change, and the worker deployed
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python tools/swap_loop_flags_apply.py out/loop-audio-measures.json
          git config user.name sonic-bot; git config user.email sonic@earlysignal.live
          changed=0
          python - <<'PY' || changed=1
          import json, subprocess, sys
          new = json.load(open("worker/loop_flags.json"))["flags"]
          try: old = json.loads(subprocess.run(["git", "show", "HEAD:worker/loop_flags.json"], capture_output=True, text=True, check=True).stdout)["flags"]
          except Exception: old = None
          sys.exit(0 if old == new else 1)
          PY
          if [ "$changed" = 1 ]; then
            git add worker/loop_flags.json && git commit -qm "loop flags: the library heard again (run ${{ github.run_id }})"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          else
            git checkout -- worker/loop_flags.json
          fi
          if [ "$changed" = 1 ] || [ "${{ inputs.deploy }}" = "true" ]; then gh workflow run worker-deploy.yml --ref main; fi
      - name: keep the results
        if: always()
        run: |
          set +e
          cd "$RUNNER_TEMP" && git clone -q --depth 1 -b swap-test-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kb || { mkdir -p kb && cd kb && git init -q && git checkout -q -b swap-test-results && cd ..; }
          cp "$GITHUB_WORKSPACE"/out/loop-audio-measures.json kb/
          cd kb && git config user.name sonic-bot && git config user.email sonic@earlysignal.live && git add -A && git commit -qm "loop audio measures ${{ github.run_id }}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" swap-test-results:swap-test-results || echo "not kept"
