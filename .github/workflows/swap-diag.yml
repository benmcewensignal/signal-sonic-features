name: swap diag
# How many licensed loops Swap can lay on a track's bars, under each rule (tools/swap_diag.py). Annotations only.
on: { workflow_dispatch: {} }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q modal numpy
      - env: { MODAL_TOKEN_ID: "${{ secrets.MODAL_TOKEN_ID }}", MODAL_TOKEN_SECRET: "${{ secrets.MODAL_TOKEN_SECRET }}" }
        run: modal run tools/swap_diag.py
