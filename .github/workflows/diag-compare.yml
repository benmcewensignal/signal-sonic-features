name: diag-compare
# Checks the comparison link by link: the worker directly (with its key), then the site's route without sign-in.
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: the worker, directly
        env: { KEY: "${{ secrets.PARTS_KEY }}" }
        run: |
          for body in '{"id":"bp:29851901","from_id":"bp:22879318"}' '{"id":"bp:22879318","from_id":"bp:28472042"}'; do
            code=$(curl -s -o /tmp/r.json -w "%{http_code}" -m 90 -X POST "https://benmcewensignal--sonic-parts-compare.modal.run/" -H "authorization: Bearer $KEY" -H "content-type: application/json" -d "$body")
            echo "::notice title=worker compare $code::$(head -c 600 /tmp/r.json)"
          done
          code=$(curl -s -o /tmp/l.json -w "%{http_code}" -m 90 -X POST "https://benmcewensignal--sonic-parts-loops.modal.run/" -H "authorization: Bearer $KEY" -H "content-type: application/json" -d '{"id":"bp:29851901"}')
          echo "::notice title=worker loops $code::$(head -c 300 /tmp/l.json)"
      - name: the site's route, not signed in
        run: |
          code=$(curl -s -o /tmp/s.json -w "%{http_code}" -m 60 -X POST "https://www.earlysignal.live/api/parts?compare=1" -H "content-type: application/json" -d '{"id":"bp:29851901","from_id":"bp:22879318"}')
          echo "::notice title=site compare, no sign-in $code::$(head -c 300 /tmp/s.json)"
