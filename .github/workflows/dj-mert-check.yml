name: dj-mert-check
# Does MERT help find what DJs played next? (tools/dj_mert_check.py) Started by mert-records once the DJ-set records are
# fingerprinted, or by hand. The result goes to the gap-tests-results branch as dj-mert-check.json.
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy scikit-learn
      - name: the inputs
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/benmcewensignal/signal-sonic.git ../ss && (cd ../ss && git sparse-checkout set data/tracklists data/djcharts)
          for f in dj-index dj-names; do curl -s -A sonic-tests -o $f.json https://www.earlysignal.live/data/$f.json; done
          mkdir -p mert && gh release download mert-records --pattern 'mert-*.jsonl.gz' --dir mert --clobber
          ls mert | wc -l
      - name: the check
        run: python tools/dj_mert_check.py --tracklists ../ss/data/tracklists --djindex dj-index.json --djnames dj-names.json --mert mert --charts ../ss/data/djcharts/charts.jsonl --out dj-mert-check.json
      - name: keep the result
        if: always()
        run: |
          cd "$RUNNER_TEMP" && git clone -q --depth 1 -b gap-tests-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" res && cd res
          cp "$GITHUB_WORKSPACE/dj-mert-check.json" . 2>/dev/null || true
          git config user.name sonic-bot; git config user.email sonic@earlysignal.live; git add -A && git commit -qm "dj mert check $(date -u +%FT%TZ)" && git push -q
