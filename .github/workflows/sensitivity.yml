name: sensitivity
# The Producer tool's sensitivity test: does the reading move the way a producer's change does? (worker/sensitivity.py)
on: { workflow_dispatch: {} }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q modal
      - name: run on Modal
        env: { MODAL_TOKEN_ID: "${{ secrets.MODAL_TOKEN_ID }}", MODAL_TOKEN_SECRET: "${{ secrets.MODAL_TOKEN_SECRET }}" }
        run: modal run worker/sensitivity.py
