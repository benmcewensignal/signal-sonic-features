name: ear-test
# Which ear hears what DJs hear: the learned model scored on pairs from published sets.
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q modal
      - name: run on Modal
        env: { MODAL_TOKEN_ID: "${{ secrets.MODAL_TOKEN_ID }}", MODAL_TOKEN_SECRET: "${{ secrets.MODAL_TOKEN_SECRET }}" }
        run: |
          modal run embed/modal_embed.py::ear_main 2>&1 | tail -20
          [ -f ear_result.json ] && echo "::notice title=ear result::$(cat ear_result.json)"
