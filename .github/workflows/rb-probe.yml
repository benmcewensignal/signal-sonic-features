name: rubberband probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -q rubberband-cli libsndfile1 >/dev/null && pip install -q numpy soundfile librosa==0.10.2
      - run: python tools/rb_freqmap_probe.py
