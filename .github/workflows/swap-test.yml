name: swap test
# Swap end to end against the deployed worker, as the page uses it (tools/swap_e2e.py): a synthetic six-minute track
# with known beats and bars and real records from several scenes, read, a loop chosen for every part, the whole track
# rendered and downloaded. Annotations; swap-test.json and the synthetic render on the swap-test-results branch.
on:
  workflow_dispatch:
    inputs:
      only: { description: "only the records whose scene or name contains this (empty: everything)", default: "" }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -q ffmpeg >/dev/null && pip install -q numpy scipy soundfile requests modal
      - name: the worker's log, while the test runs
        env: { MODAL_TOKEN_ID: "${{ secrets.MODAL_TOKEN_ID }}", MODAL_TOKEN_SECRET: "${{ secrets.MODAL_TOKEN_SECRET }}" }
        run: |
          mkdir -p "$RUNNER_TEMP/swap-out"
          PYTHONUNBUFFERED=1 nohup timeout 5000 modal app logs sonic-parts --timestamps > "$RUNNER_TEMP/swap-out/modal-logs.txt" 2>&1 &
          echo $! > "$RUNNER_TEMP/logs.pid"; sleep 5
      - name: end to end
        env: { PARTS_KEY: "${{ secrets.PARTS_KEY }}", SWAP_ONLY: "${{ inputs.only }}" }
        run: python tools/swap_e2e.py "$RUNNER_TEMP/swap-out"
      - name: what the worker's log says
        if: always()
        run: |
          sleep 20; kill -INT "$(cat "$RUNNER_TEMP/logs.pid")" 2>/dev/null || true; sleep 3
          python tools/swap_logsum.py "$RUNNER_TEMP/swap-out/modal-logs.txt" || true
      - name: keep the results
        if: always()
        run: |
          set +e
          cd "$RUNNER_TEMP" && mkdir -p kb && cd kb && git init -q && git checkout -q -b swap-test-results
          cp "$RUNNER_TEMP"/swap-out/swap-test.json . ; cp "$RUNNER_TEMP"/swap-out/*.mp3 . 2>/dev/null; cp "$RUNNER_TEMP"/swap-out/modal-logs.txt . 2>/dev/null
          git config user.name sonic-bot; git config user.email sonic@earlysignal.live; git add -A && git commit -qm "swap test ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" swap-test-results:swap-test-results || echo "not kept"
