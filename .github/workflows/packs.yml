name: packs
# A sample pack shared from Drive, measured loop by loop for a private demo library (measurements only; no audio kept).
on:
  workflow_dispatch:
    inputs:
      drive_id: { description: "the Drive file id of the pack's zip (shared as anyone with the link)", default: "" }
      pack: { description: "the pack's name", default: "pack" }
permissions: { contents: read }
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get install -y -q ffmpeg >/dev/null
      - run: pip install -q gdown numpy "librosa==0.10.2" soundfile requests scipy; pip install -q -r requirements.txt 2>/dev/null || true
      - name: fetch the pack from Drive
        run: gdown --id "${{ inputs.drive_id }}" -O pack.zip && ls -la pack.zip
      - name: measure it
        run: python tools/pack_ingest.py --zip pack.zip --pack "${{ inputs.pack }}" --out "data/private/$(echo '${{ inputs.pack }}' | tr -cs 'A-Za-z0-9' '-').json"
      - name: keep the measurements privately (Modal storage, not this public repository)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          pip install -q modal
          for f in data/private/*.json; do modal volume put sonic-embed "$f" "/private/$(basename "$f")" --force && echo "kept privately: $(basename "$f")"; done
