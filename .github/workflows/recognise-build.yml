name: recognise build
# the dense classics index for recognition in a room: every fingerprint of each classic's preview, all versions, onto the
# sonic-recognise volume (the recognise endpoint memory-maps it when it wakes). Daily, and by hand after canon waves.
on:
  workflow_dispatch:
    inputs:
      what: { description: "classics, all, or test", default: "classics" }
  schedule:
    - cron: "30 7 * * *"   # daily: the classics
    - cron: "0 6 * * 0"    # weekly: the catalogue-wide index, rebuilt from the whole store (about 12,000 records a day join it) and tested
permissions: { contents: read }
concurrency: { group: sonic-recognise-build, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q modal
      - name: build the dense classics index
        env: { MODAL_TOKEN_ID: "${{ secrets.MODAL_TOKEN_ID }}", MODAL_TOKEN_SECRET: "${{ secrets.MODAL_TOKEN_SECRET }}" }
        run: |
          set -o pipefail
          fail(){ tail -n 12 /tmp/out.txt | tr -d '\r' | sed -e 's/^/::error title=recognise::/' ; exit 1; }
          W="${{ github.event.inputs.what || (github.event.schedule == '0 6 * * 0' && 'weekly') || 'classics' }}"
          case "$W" in
            weekly)
              # the endpoint reads a new all/ as soon as it is written, so the test runs straight after the build and, if
              # a record outside the index or a wrong record was named, stands the index down (the classics stay)
              modal run worker/recognise_build_all.py 2>&1 | tee /tmp/out.txt || fail
              modal run worker/recognise_test_all.py --activate 2>&1 | tee /tmp/out.txt || fail
              python3 - <<'PY' || { modal run worker/recognise_off.py 2>&1 | tail -3; exit 1; }
          import json, re, sys
          m = re.search(r"catalogue index test::(\{.*\})", open("/tmp/out.txt").read())
          if not m: print("::warning title=recognise::no test summary found"); sys.exit(0)
          s = json.loads(m.group(1))["summary"]; wrong = {k: v["wrong"] for k, v in s.items() if v.get("wrong")}
          if wrong: print(f"::error title=recognise::the weekly catalogue index named records wrongly ({wrong}); standing it down"); sys.exit(1)
          PY
              ;;
            all) modal run worker/recognise_build_all.py 2>&1 | tee /tmp/out.txt || fail ;;
            test) modal run worker/recognise_test_all.py 2>&1 | tee /tmp/out.txt || fail ;;
            activate) modal run worker/recognise_test_all.py --activate 2>&1 | tee /tmp/out.txt || fail ;;
            deactivate) modal run worker/recognise_off.py 2>&1 | tee /tmp/out.txt || fail ;;
            inspect) modal run worker/recognise_inspect.py 2>&1 | tee /tmp/out.txt || fail ;;
            *) modal run worker/recognise_build.py 2>&1 | tee /tmp/out.txt || fail ;;
          esac
