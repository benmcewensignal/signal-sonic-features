name: swap follow test
# Follow-your-notes on synthetic parts with known notes and patterns (tools/swap_follow_test.py). Annotations only.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["worker/swap.py", "tools/swap_follow_test.py", ".github/workflows/swap-follow-test.yml"]
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -q rubberband-cli libsndfile1 ffmpeg >/dev/null && pip install -q "numpy<2" scipy soundfile librosa==0.10.2
      - run: python tools/swap_follow_test.py
