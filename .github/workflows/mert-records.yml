name: mert-records
# MERT fingerprints of the matching index's records, on GitHub's runners (tools/mert_records.py). A wave of 18 jobs works
# just under the six-hour limit, files its fingerprints in the mert-records release, and starts the next wave until every
# record is done. Two job slots stay free for the rest of the pipeline. Nothing on the site reads these yet.
on:
  workflow_dispatch:
    inputs:
      shards: { description: "jobs in a wave", default: "18" }
      budget: { description: "seconds of work per job", default: "18600" }
      chain: { description: "start the next wave when this one ends (yes/no)", default: "yes" }
permissions: { contents: write, actions: write }
concurrency: { group: mert-records, cancel-in-progress: false }
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs: { matrix: "${{ steps.m.outputs.matrix }}" }
    steps:
      - id: m
        run: python3 -c "import json; n=int('${{ inputs.shards || '18' }}'); print('matrix='+json.dumps({'shard':list(range(n))}))" >> "$GITHUB_OUTPUT"
  shard:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy: { fail-fast: false, max-parallel: 18, matrix: "${{ fromJSON(needs.plan.outputs.matrix) }}" }
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with: { path: "~/.cache", key: "mert-models-v1" }
      - run: sudo apt-get install -y -q ffmpeg >/dev/null
      - run: |
          pip install -q torch==2.3.1 torchaudio==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "numpy<2" librosa==0.10.2 soundfile demucs==4.0.1 transformers==4.46.3 nnAudio==0.3.3 huggingface_hub
      - name: records already done
        run: |
          gh release view mert-records >/dev/null 2>&1 || gh release create mert-records --title "MERT fingerprints of records' parts" --notes "tools/mert_records.py: window-only separation, MERT per part; one jsonl.gz per job, with its id list" || true
          mkdir -p ids && gh release download mert-records --pattern 'mert-ids-*.txt' --dir ids --clobber 2>/dev/null || true
          cat ids/*.txt 2>/dev/null | sort -u > done-ids.txt; wc -l < done-ids.txt
      - name: fingerprint this shard
        run: python tools/mert_records.py ${{ matrix.shard }} ${{ inputs.shards || '18' }} ${{ inputs.budget || '18600' }}
      - name: file the fingerprints
        if: always()
        run: |
          for f in mert-out/*; do [ -s "$f" ] && gh release upload mert-records "$f" --clobber; done; ls -la mert-out || true
  next:
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - name: count, and start the next wave if records remain
        run: |
          mkdir -p ids && gh release download mert-records --repo "${{ github.repository }}" --pattern 'mert-ids-*.txt' --dir ids --clobber 2>/dev/null || true
          done=$(cat ids/*.txt 2>/dev/null | sort -u | wc -l)
          total=$(python3 -c "import json,urllib.request as u; R=lambda x: json.loads(u.urlopen(u.Request(x,headers={'User-Agent':'sonic-mert'}),timeout=180).read()); p=R('https://www.earlysignal.live/data/previews.json')['previews']; i=R('https://raw.githubusercontent.com/benmcewensignal/signal-sonic-audio/main/out/index.json'); print(sum(1 for t in i['tracks'] if t['track_id'] in p))")
          added=$(cat ids/mert-ids-*-${{ github.run_id }}.txt 2>/dev/null | wc -l)
          echo "fingerprinted: $done of $total (this wave: $added)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$added" -eq 0 ]; then echo "this wave added nothing: the chain stops" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ "${{ inputs.chain || 'yes' }}" = "yes" ] && [ "$done" -lt "$((total - 50))" ]; then gh workflow run mert-records.yml --repo "${{ github.repository }}" -f shards="${{ inputs.shards || '18' }}"; echo "next wave started" | tee -a "$GITHUB_STEP_SUMMARY"; fi
