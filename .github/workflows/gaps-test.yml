name: gaps test
# Two open questions on the deployed reader: is the separated Your track reading ready, and is the bleed filter discarding real bass (tools/gaps_test.py)
on:
  workflow_dispatch: {}

permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q modal numpy librosa soundfile
      - name: run on Modal
        env: { MODAL_TOKEN_ID: "${{ secrets.MODAL_TOKEN_ID }}", MODAL_TOKEN_SECRET: "${{ secrets.MODAL_TOKEN_SECRET }}" }
        run: set -o pipefail; modal run tools/gaps_test.py 2>&1 | tee gaps-test.txt | tail -60 >> "$GITHUB_STEP_SUMMARY"
      - name: keep the result
        if: always()
        run: |
          git config user.name sonic-bot; git config user.email sonic-bot@users.noreply.github.com
          mkdir -p /tmp/r; cp gaps-test.txt /tmp/r/ 2>/dev/null || true; cp gaps-test.json /tmp/r/ 2>/dev/null || true
          git checkout -q -B gaps-test-results; git rm -rq --cached . >/dev/null 2>&1 || true
          cp /tmp/r/* . 2>/dev/null || true; git add -f gaps-test.txt gaps-test.json 2>/dev/null || true; git commit -qm "gaps test $(date -u +%FT%TZ)" || true; git push -q -f origin gaps-test-results
